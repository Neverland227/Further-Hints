[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "affine-hints"
version = "0.1.0"
description = "Bounded synthetic experiments for exact affine hints and discrete LWE secret priors"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "sympy>=1.12",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "networkx>=3.2",
  "psutil>=5.9",
]

[project.optional-dependencies]
lattice = ["fpylll>=0.6.4"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

